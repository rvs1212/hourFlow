name: Bug Report
description: Report a bug in HourFlow
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched for existing issues before reporting this bug.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Provide a clear description of the issue.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did the issue occur?
      options:
        - Local development
        - Staging
        - Production
        - Not sure
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Device and browser details
      placeholder: |
        Device:
        Operating system:
        Browser and version:
        Affected page URL:

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: |
        Attach screenshots or relevant error messages.
        Remove passwords, tokens, and other sensitive information.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include anything else that may help understand the issue.
