name: Feature Request
description: Suggest a new feature or enhancement for HourFlow
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched for existing issues and feature requests.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve?
      placeholder: |
        As a user, I want to...
        Currently, I have difficulty with...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like this feature to work.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe the conditions that would make this feature complete.
      placeholder: |
        - [ ] Users can...
        - [ ] The application should...
        - [ ] An error message appears when...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds.

  - type: textarea
    id: designs
    attributes:
      label: Mockups or references
      description: Attach screenshots, mockups, or relevant links.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any additional information about the request.
