name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Linter
    uses: ./.github/workflows/lint.yml

  deploy:
    name: Deploy to Laravel Cloud
    runs-on: ubuntu-latest
    needs:
      - tests
      - lint

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify latest staging commit
        id: latest
        run: |
          set -euo pipefail

          LATEST_SHA=$(git ls-remote origin refs/heads/staging | cut -f1)

          if [[ "$LATEST_SHA" != "$GITHUB_SHA" ]]; then
            echo "Staging has a newer commit. Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger staging deployment
        if: steps.latest.outputs.should_deploy == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LARAVEL_CLOUD_STAGING_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::error::Staging deploy hook is not configured."
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
