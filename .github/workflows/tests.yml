name: tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

  push:
    branches:
      - main
      - production

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
          mariadb:
            image: mariadb:11.8
            env:
              MARIADB_ROOT_PASSWORD: root
              MARIADB_DATABASE: hourflow_ci_test
              MARIADB_USER: hourflow_ci
              MARIADB_PASSWORD: hourflow_ci
            ports:
              - 3306:3306
            options: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: npm run build

      - name: Run Pest Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hourflow_ci_test
          DB_USERNAME: hourflow_ci
          DB_PASSWORD: hourflow_ci
        run: php artisan test --coverage-clover=coverage.xml
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
